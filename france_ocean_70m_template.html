<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>France - Montée des océans +70 m</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body,#map{
    height:100%;
    margin:0;
}
.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:white;
    padding:10px;
    border-radius:8px;
}
</style>
</head>
<body>

<div class="panel">
<button id="toggle">Afficher / masquer +70 m</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([46.6,2.4],6);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{attribution:'© OpenStreetMap'}
).addTo(map);

let oceanLayer = null;

document.getElementById('toggle').addEventListener('click', async () => {

    if(oceanLayer){
        map.removeLayer(oceanLayer);
        oceanLayer = null;
        return;
    }

    // Remplacer cette URL par le GeoJSON réel +70 m
    const url = "https://exemple.org/ocean_70m.geojson";

    const response = await fetch(url);
    const geojson = await response.json();

    oceanLayer = L.geoJSON(geojson, {
        style:{
            color:"#0066ff",
            weight:1,
            fillColor:"#0088ff",
            fillOpacity:0.45
        }
    });

    oceanLayer.addTo(map);
});
</script>

</body>
</html>
