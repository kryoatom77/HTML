<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte France — Explorateur</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--surf:#161b22;--surf2:#21262d;--bord:#30363d;--acc:#e36d2b;--txt:#e6edf3;--muted:#8b949e;--pw:292px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;height:100vh;display:flex;overflow:hidden}

/* ── PANNEAU ── */
#panel{width:var(--pw);background:var(--surf);border-right:1px solid var(--bord);display:flex;flex-direction:column;z-index:1001;flex-shrink:0;transition:width .25s,opacity .25s}
#panel.collapsed{width:0;opacity:0;pointer-events:none}
#ph{padding:15px 16px 10px;border-bottom:1px solid var(--bord);background:var(--bg);display:flex;align-items:flex-start;gap:8px}
#ph-text{flex:1}
#ph h1{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;letter-spacing:-.02em;line-height:1.2}
#ph p{font-size:.65rem;color:var(--muted);margin-top:2px}
#lc{flex:1;overflow-y:auto;padding:6px 0;scrollbar-width:thin;scrollbar-color:var(--bord) transparent}
.gl{font-family:'Syne',sans-serif;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--acc);padding:9px 14px 3px}
.lr{display:flex;align-items:center;gap:7px;padding:5px 14px;cursor:pointer;transition:background .15s;position:relative}
.lr:hover{background:var(--surf2)}
.lr.on{background:rgba(227,109,43,.08)}
.lr.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);border-radius:0 2px 2px 0}
.tog{width:28px;height:16px;background:var(--bord);border-radius:8px;position:relative;flex-shrink:0;transition:background .2s}
.tog::after{content:'';position:absolute;width:10px;height:10px;background:var(--muted);border-radius:50%;top:3px;left:3px;transition:transform .2s,background .2s}
.lr.on .tog{background:rgba(227,109,43,.35)}
.lr.on .tog::after{transform:translateX(12px);background:var(--acc)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.li{flex:1;min-width:0}
.ln{font-size:.77rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls{font-size:.62rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spin{width:9px;height:9px;border:2px solid var(--bord);border-top-color:var(--acc);border-radius:50%;animation:sp .6s linear infinite;flex-shrink:0;display:none}
.lr.loading .spin{display:block}
.lr.err .ls{color:#f87171!important}
@keyframes sp{to{transform:rotate(360deg)}}
#pf{padding:8px 14px;border-top:1px solid var(--bord);font-size:.6rem;color:var(--muted);line-height:1.4}

/* ── TOGGLE BOUTON (au-dessus des contrôles zoom) ── */
#toggle-panel{position:absolute;top:12px;left:calc(var(--pw) + 12px);z-index:1002;background:var(--surf);border:1px solid var(--bord);border-radius:7px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,left .25s;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#toggle-panel:hover{background:var(--surf2)}
#toggle-panel svg{width:16px;height:16px;fill:none;stroke:var(--txt);stroke-width:2;stroke-linecap:round}

/* ── BOUTON FRANCE ENTIÈRE (sous le zoom) ── */
#fit-france{position:absolute;top:160px;left:calc(var(--pw) + 12px);z-index:1000;background:var(--surf);border:1px solid var(--bord);border-radius:4px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,left .25s;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#fit-france:hover{background:var(--surf2)}
#fit-france svg{width:17px;height:17px;fill:none;stroke:var(--txt);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── CHRONO CHARGEMENT ── */
#load-time{color:#34d399;font-weight:600}

/* ── CARTE ── */
#map{flex:1;height:100vh;position:relative}

/* ── LÉGENDE ── */
#leg{position:absolute;bottom:28px;right:12px;z-index:1000;background:var(--surf);border:1px solid var(--bord);border-radius:8px;padding:9px 12px;min-width:155px;max-width:210px;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4);font-size:.68rem}
#leg h4{font-family:'Syne',sans-serif;font-size:.7rem;font-weight:700;color:var(--acc);margin-bottom:6px}
.li2{display:flex;align-items:center;gap:6px;margin:3px 0}
.lc2{width:12px;height:12px;border-radius:2px;flex-shrink:0}

/* ── STATUSBAR ── */
#sb{position:absolute;bottom:0;left:0;right:0;height:22px;background:rgba(13,17,23,.93);border-top:1px solid var(--bord);display:flex;align-items:center;padding:0 10px;font-size:.63rem;color:var(--muted);z-index:999;gap:12px;white-space:nowrap;overflow:hidden}
#sb b{color:#f0a500}
#sb-dep{color:#60a5fa;font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis}

/* Leaflet */
.leaflet-popup-content-wrapper{background:var(--surf);border:1px solid var(--bord);border-radius:8px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:.78rem;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.leaflet-popup-tip{background:var(--surf)}
.leaflet-popup-close-button{color:var(--muted)!important}
.leaflet-control-zoom{margin-left:calc(var(--pw) + 54px)!important;margin-top:54px!important;transition:margin-left .25s}
.leaflet-control-zoom a{background:var(--surf)!important;color:var(--txt)!important;border-color:var(--bord)!important}
.leaflet-control-attribution{background:rgba(13,17,23,.85)!important;color:var(--muted)!important;font-size:.55rem!important}
.leaflet-control-attribution a{color:var(--acc)!important}
#lc::-webkit-scrollbar{width:3px}
#lc::-webkit-scrollbar-thumb{background:var(--bord);border-radius:2px}

@media(max-width:600px){
  :root{--pw:100vw}
  #panel{position:absolute;top:0;bottom:0;left:0}
  #panel.collapsed{width:0}
}
</style>
</head>
<body class="panel-open">

<div id="panel">
  <div id="ph">
    <div id="ph-text"><h1>Explorateur<br>France</h1><p>Données publiques · calques</p></div>
  </div>
  <div id="lc"></div>
  <div id="pf">OSM · Stadia · INSEE · IRSN · Sandre · ORM · CyclOSM · data.gouv.fr</div>
</div>

<div id="map">
  <!-- Bouton toggle panneau -->
  <button id="toggle-panel" title="Afficher/masquer le panneau">
    <svg viewBox="0 0 20 20"><line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></svg>
  </button>
  <!-- Bouton vue France entière -->
  <button id="fit-france" title="Voir la France entière">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 6 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-6-3.5-9s1-6.5 3.5-9z"/></svg>
  </button>
</div>

<div id="leg"><h4 id="lt">Légende</h4><div id="lb"></div></div>
<div id="sb">
  Coords&nbsp;: <b id="co">—</b>
  &nbsp;|&nbsp; Calques&nbsp;: <b id="ac">0</b>
  &nbsp;|&nbsp; <b id="st">Prêt</b>
  &nbsp;|&nbsp; <span id="sb-dep">—</span>
</div>

<script>
// ════════════════════════════════════════
// TOGGLE PANNEAU
// ════════════════════════════════════════
const panelEl=document.getElementById('panel');
const toggleBtn=document.getElementById('toggle-panel');
const fitFranceBtn=document.getElementById('fit-france');
let panelOpen=true;

function repositionControls(){
  const offset=panelOpen?`calc(var(--pw) + 12px)`:'12px';
  toggleBtn.style.left=offset;
  fitFranceBtn.style.left=offset;
  const zoomEl=document.querySelector('.leaflet-control-zoom');
  if(zoomEl) zoomEl.style.marginLeft=panelOpen?`calc(var(--pw) + 54px)`:'54px';
}

toggleBtn.addEventListener('click',()=>{
  panelOpen=!panelOpen;
  panelEl.classList.toggle('collapsed',!panelOpen);
  repositionControls();
  setTimeout(()=>map.invalidateSize(),300);
});

// Bouton "France entière"
fitFranceBtn.addEventListener('click',()=>{
  map.setView([46.6,2.4],6);
  document.getElementById('sb-dep').textContent='—';
});

// ════════════════════════════════════════
// CARTE
// ════════════════════════════════════════
const map=L.map('map',{center:[46.5,2.3],zoom:6,zoomControl:true});

// Fond de carte OSM France — labels en français, routes visibles, pas de blocage
L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap France',maxZoom:20,subdomains:'abc',opacity:1
}).addTo(map);

map.on('mousemove',e=>document.getElementById('co').textContent=
  e.latlng.lat.toFixed(4)+', '+e.latlng.lng.toFixed(4));

// ════════════════════════════════════════
// PALETTE VERT → ORANGE → ROUGE
// ════════════════════════════════════════
const PAL5=[[39,174,96],[142,199,64],[241,196,15],[230,126,34],[192,57,43]];
function lerp(a,b,t){return Math.round(a+(b-a)*t)}
function lerpRGB(c1,c2,t){return`rgb(${lerp(c1[0],c2[0],t)},${lerp(c1[1],c2[1],t)},${lerp(c1[2],c2[2],t)})`}
function palGVR(t){
  t=Math.max(0,Math.min(1,t));
  const seg=t*(PAL5.length-1),i=Math.floor(seg),f=seg-i;
  return i>=PAL5.length-1?`rgb(${PAL5[PAL5.length-1].join(',')})`:lerpRGB(PAL5[i],PAL5[i+1],f);
}
function mkLeg(min,max,unit,inv){
  return Array.from({length:5},(_,i)=>{
    const t=i/4,tc=inv?t:1-t,val=min+(max-min)*t;
    return{color:palGVR(tc),label:`${Number.isInteger(val)?val:val.toFixed(1)} ${unit}`};
  });
}

// ── Échelle par RANG (percentile) ──
// Au lieu d'une échelle linéaire min/max (qui écrase les valeurs vers le centre
// quand la distribution est resserrée), on classe chaque valeur par son
// rang relatif parmi toutes les valeurs du département. Ainsi Paris/Lyon/
// Toulouse/Bordeaux (qui sont dans le top 5-10% pour crimes/cambriolages)
// ressortent bien en rouge foncé, conformément à leur position réelle.
const RANKCACHE={};
function rankScale(key){
  if(RANKCACHE[key]) return RANKCACHE[key];
  const entries=Object.entries(DATADEP[key]).sort((a,b)=>a[1]-b[1]);
  const n=entries.length;
  const map={};
  entries.forEach(([code,val],i)=>{
    map[code]=n>1?i/(n-1):0.5; // 0 = plus bas, 1 = plus haut
  });
  RANKCACHE[key]=map;
  return map;
}
// Légende basée sur quantiles réels (valeurs à 0/25/50/75/100%)
function mkLegRank(key,unit,inv,decimals=1){
  const vals=Object.values(DATADEP[key]).sort((a,b)=>a-b);
  const n=vals.length;
  return [0,0.25,0.5,0.75,1].map(p=>{
    const idx=Math.min(n-1,Math.round(p*(n-1)));
    const val=vals[idx];
    const tc=inv?p:1-p;
    const label=Number.isInteger(val)?val.toLocaleString('fr-FR'):val.toFixed(decimals);
    return{color:palGVR(tc),label:`${label} ${unit}`};
  });
}

function depFromCode(code){
  const s=String(code||'');
  if(s.startsWith('2A')||s.startsWith('2B')) return s.slice(0,2);
  if(s.length>=5) return s.slice(0,2).replace(/^0/,'').padStart(2,'0');
  return s;
}

// CACHE GEOJSON
// ════════════════════════════════════════
const CACHE={};
async function fetchGJ(url){
  if(CACHE[url]) return CACHE[url];
  const r=await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  CACHE[url]=await r.json();
  return CACHE[url];
}

// GeoJSON cantons France (436 cantons) — bien plus précis que 96 départements
// Source : gregoiredavid/france-geojson
const URL_CAN='https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/cantons-version-simplifiee.geojson';
const URL_DEP='https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson';
const URL_COM='https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/communes-version-simplifiee.geojson';

// ════════════════════════════════════════
// CHOROPLÈTHE CANTONS
// Les cantons héritent de la valeur de leur département
// 436 zones au lieu de 96 — visuellement 4-5× plus précis
// ════════════════════════════════════════
async function choroDep(key,min,max,inv,labelFn){
  const data=await fetchGJ(URL_DEP);
  const ranks=rankScale(key);
  return L.geoJSON(data,{
    style:f=>{
      const dep=f.properties.code;
      const r=ranks[dep];
      if(r===undefined) return{fillColor:'#2a2a2a',color:'#111',weight:.4,fillOpacity:.6};
      const tc=inv?r:1-r;
      return{fillColor:palGVR(tc),color:'#111',weight:.4,fillOpacity:.73};
    },
    onEachFeature:(f,l)=>{
      const val=DATADEP[key][f.properties.code];
      l.bindPopup(`<b>${f.properties.nom}</b><br>${labelFn(val)}`);
    }
  });
}

// choroCan : Paris (75) est absent du GeoJSON cantons de gregoiredavid.
// Plutôt qu'un merge fragile avec le fichier communes (qui posait problème
// d'affichage), on dessine Paris séparément avec un polygone simple
// (contour approximatif du périphérique) superposé en dernier, garanti
// d'avoir la bonne couleur calculée depuis ranks['75'].
const PARIS_OUTLINE=[[48.902,2.224],[48.890,2.260],[48.875,2.300],[48.866,2.350],[48.846,2.395],[48.822,2.418],[48.818,2.400],[48.815,2.355],[48.819,2.310],[48.825,2.270],[48.836,2.245],[48.855,2.230],[48.880,2.220],[48.902,2.224]];

async function choroCan(key,min,max,inv,labelFn){
  const data=await fetchGJ(URL_CAN);
  const ranks=rankScale(key);

  function styleFor(dep){
    const r=ranks[dep];
    if(r===undefined) return{fillColor:'#2a2a2a',color:'#111',weight:.2,fillOpacity:.6};
    const tc=inv?r:1-r;
    return{fillColor:palGVR(tc),color:'#111',weight:.2,fillOpacity:.73};
  }

  const cantons=L.geoJSON(data,{
    style:f=>{
      const raw=String(f.properties.code||'');
      const dep=raw.startsWith('2A')||raw.startsWith('2B')?raw.slice(0,2):raw.slice(0,2).replace(/^0/,'').padStart(2,'0');
      return styleFor(dep);
    },
    onEachFeature:(f,l)=>{
      const raw=String(f.properties.code||'');
      const dep=raw.startsWith('2A')||raw.startsWith('2B')?raw.slice(0,2):raw.slice(0,2).replace(/^0/,'').padStart(2,'0');
      const nom=f.properties.nom||raw;
      const val=DATADEP[key][dep];
      l.bindPopup(`<b>${nom}</b><br><small>Dép. ${dep}</small><br>${labelFn(val)}`);
    }
  });

  // Overlay Paris (75) — dessiné par-dessus, couleur garantie correcte
  const parisStyle=styleFor('75');
  const parisLayer=L.polygon(PARIS_OUTLINE,{
    fillColor:parisStyle.fillColor,color:'#111',weight:.2,fillOpacity:.73
  }).bindPopup(`<b>Paris</b><br><small>Dép. 75</small><br>${labelFn(DATADEP[key]['75'])}`);

  return L.layerGroup([cantons,parisLayer]);
}

// Pour données strictement par département (immo) → on garde communes
async function choroCom(key,min,max,inv,labelFn){
  const data=await fetchGJ(URL_COM);
  const ranks=rankScale(key);
  return L.geoJSON(data,{
    style:f=>{
      const code=f.properties.code||'';
      const dep2=code.startsWith('2A')||code.startsWith('2B')?code.slice(0,2):code.slice(0,2).replace(/^0/,'').padStart(2,'0');
      const r=ranks[dep2];
      if(r===undefined) return{fillColor:'#2a2a2a',color:'#111',weight:.1,fillOpacity:.6};
      const tc=inv?r:1-r;
      return{fillColor:palGVR(tc),color:'#111',weight:.1,fillOpacity:.73};
    },
    onEachFeature:(f,l)=>{
      const code=f.properties.code||'';
      const dep2=code.startsWith('2A')||code.startsWith('2B')?code.slice(0,2):code.slice(0,2).replace(/^0/,'').padStart(2,'0');
      const val=DATADEP[key][dep2];
      l.bindPopup(`<b>${f.properties.nom}</b><br>${labelFn(val)}`);
    }
  });
}

// CALQUE DÉPARTEMENTS avec zoom au clic
// ════════════════════════════════════════
let depLayer=null;
async function buildDepLayer(){
  const data=await fetchGJ(URL_DEP);
  depLayer=L.geoJSON(data,{
    style:{color:'#94a3b8',weight:3,fillOpacity:0,dashArray:'5,3'},
    onEachFeature:(f,l)=>{
      l.on('click',e=>{
        // Zoom sur le département
        map.fitBounds(l.getBounds(),{padding:[40,40]});
        // Afficher le nom dans la statusbar
        document.getElementById('sb-dep').textContent=
          `${f.properties.nom} (${f.properties.code})`;
        L.DomEvent.stopPropagation(e);
      });
      l.on('mouseover',()=>{
        l.setStyle({color:'#e36d2b',weight:2});
      });
      l.on('mouseout',()=>{
        depLayer.resetStyle(l);
      });
    }
  });
  return depLayer;
}

  // ── ÉCONOMIE ──
  // Sites industriels (sections NAF B = industries extractives, C = industrie
  // manufacturière) classés par tranche d'effectif salarié, à la manière de
  // la carte de référence (bleu/orange/rouge selon la taille de l'établissement).
  // Source : API Recherche d'entreprises (recherche-entreprises.api.gouv.fr /near_point),
  // alimentée par le répertoire SIRENE de l'INSEE.
  //
  // Approche : grille de points couvrant la France métropolitaine, requête
  // /near_point (rayon 40km, max autorisé 50km) par point, filtrée sur
  // section_activite_principale=B,C. Chaque requête retourne les établissements
  // (matching_etablissements) avec leurs coordonnées et tranche d'effectif —
  // contrairement à /search qui ne renvoie que le siège social (raterait les
  // établissements locaux d'un groupe national, ex: usine de 180 employés
  // à Cahors dont le siège est ailleurs).
  {id:'industrie',name:'Sites industriels (effectifs)',src:'API SIRENE / near_point',group:'Économie',color:'#f87171',
   legend:[
     {color:'#7dd3fc',label:'100 à 199 employés'},
     {color:'#fb923c',label:'200 à 499 employés'},
     {color:'#dc2626',label:'500 employés et plus'}
   ],
   load:async()=>{
     // Tranches d'effectif INSEE retenues (>=100 salariés) :
     // 22=100-199, 31=200-249, 32=250-499, 41=500-999, 42=1000-1999,
     // 51=2000-4999, 52=5000-9999, 53=10000+
     const TRANCHE_INFO={
       '22':{color:'#7dd3fc',radius:4,label:'100 à 199 employés'},
       '31':{color:'#fb923c',radius:6,label:'200 à 499 employés'},
       '32':{color:'#fb923c',radius:6,label:'200 à 499 employés'},
       '41':{color:'#dc2626',radius:8,label:'500 employés et plus'},
       '42':{color:'#dc2626',radius:8,label:'500 employés et plus'},
       '51':{color:'#dc2626',radius:8,label:'500 employés et plus'},
       '52':{color:'#dc2626',radius:8,label:'500 employés et plus'},
       '53':{color:'#dc2626',radius:8,label:'500 employés et plus'},
     };

     // Grille de points couvrant la France métropolitaine (~1° espacement,
     // rayon 45km par point pour assurer un recouvrement complet sans trous)
     const grid=[];
     for(let lat=42.5;lat<=51.0;lat+=0.8){
       for(let lng=-4.5;lng<=8.0;lng+=0.9){
         grid.push([lat,lng]);
       }
     }

     const seen=new Set(); // dédoublonnage par SIRET
     const markers=[];
     const st=document.getElementById('st');

     // Traitement séquentiel avec throttling (~5 req/s pour rester sous la limite de 7/s)
     for(let i=0;i<grid.length;i++){
       const [lat,lng]=grid[i];
       st.innerHTML=`Chargement industries… <span id="load-time">${i+1}/${grid.length}</span>`;
       try{
         const url=`https://recherche-entreprises.api.gouv.fr/near_point?lat=${lat}&long=${lng}&radius=45&section_activite_principale=B,C&per_page=25&minimal=true`;
         const r=await fetch(url);
         if(r.ok){
           const data=await r.json();
           (data.results||[]).forEach(ent=>{
             const etabs=ent.matching_etablissements||(ent.siege?[ent.siege]:[]);
             etabs.forEach(etab=>{
               if(!etab||!etab.coordonnees||!etab.siret) return;
               if(seen.has(etab.siret)) return;
               const tr=(etab.tranche_effectif_salarie||'').toString();
               const info=TRANCHE_INFO[tr];
               if(!info) return; // on ignore < 100 salariés
               seen.add(etab.siret);
               const [elat,elng]=etab.coordonnees.split(',').map(Number);
               if(isNaN(elat)||isNaN(elng)) return;
               markers.push(L.circleMarker([elat,elng],{
                 radius:info.radius,fillColor:info.color,color:'#1a1a1a',weight:.6,fillOpacity:.8
               }).bindPopup(`<b>${ent.nom_complet||ent.nom_raison_sociale||'—'}</b><br>${etab.activite_principale||''}<br><small>${etab.adresse||''}</small><br>Effectif : <b>${info.label}</b>`));
             });
           });
         }
       }catch(e){console.error('industrie near_point',lat,lng,e);}
       // Throttle : ~180ms entre requêtes ≈ 5,5 req/s
       await new Promise(res=>setTimeout(res,180));
     }
     return L.layerGroup(markers);
   }},

// ════════════════════════════════════════
// GESTION DES CALQUES
// ════════════════════════════════════════
const active={},loaded={};
async function toggle(def,row){
  const id=def.id;
  if(active[id]){
    const l=active[id];
    if(l.remove) l.remove();
    else map.removeLayer(l);
    delete active[id];
    row.classList.remove('on');upCount();upLeg();return;
  }
  row.classList.add('loading');
  const t0=performance.now();
  document.getElementById('st').innerHTML='Chargement…';
  try{
    let layer=loaded[id];
    if(!layer){layer=await def.load();loaded[id]=layer;}
    layer.addTo(map);
    active[id]=layer;
    row.classList.remove('loading');row.classList.add('on');
    const dt=((performance.now()-t0)/1000).toFixed(2);
    document.getElementById('st').innerHTML=`Prêt <span id="load-time">(${dt}s)</span>`;
  }catch(e){
    console.error(id,e);
    row.classList.remove('loading');row.classList.add('err');
    row.querySelector('.ls').textContent='⚠ '+e.message.slice(0,48);
    const dt=((performance.now()-t0)/1000).toFixed(2);
    document.getElementById('st').innerHTML=`Erreur <span id="load-time">(${dt}s)</span>`;
  }
  upCount();upLeg();
}
function upCount(){document.getElementById('ac').textContent=Object.keys(active).length;}
function upLeg(){
  const leg=document.getElementById('leg');
  const last=DEFS.filter(d=>active[d.id]&&d.legend&&d.legend.length).pop();
  if(!last){leg.style.display='none';return;}
  document.getElementById('lt').textContent=last.name;
  document.getElementById('lb').innerHTML=last.legend.map(i=>`<div class="li2"><div class="lc2" style="background:${i.color}"></div>${i.label}</div>`).join('');
  leg.style.display='block';
}

// ════════════════════════════════════════
// PANNEAU
// ════════════════════════════════════════
const panel2=document.getElementById('lc');
let curGroup='';
DEFS.forEach(def=>{
  if(def.group!==curGroup){
    const g=document.createElement('div');
    g.className='gl';g.textContent=def.group;
    panel2.appendChild(g);curGroup=def.group;
  }
  const row=document.createElement('div');
  row.className='lr';row.dataset.id=def.id;
  row.innerHTML=`<div class="tog"></div><div class="dot" style="background:${def.color}"></div><div class="li"><div class="ln">${def.name}</div><div class="ls">${def.src}</div></div><div class="spin"></div>`;
  row.addEventListener('click',()=>toggle(def,row));
  panel2.appendChild(row);
});

// Calques par défaut
['deps'].forEach(id=>{
  const def=DEFS.find(d=>d.id===id);
  const row=panel2.querySelector(`[data-id="${id}"]`);
  if(def&&row) toggle(def,row);
});

// Init position des contrôles
repositionControls();
