<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SunCast - carte d'ombres solaires 3D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px system-ui,Arial,sans-serif;color:#1b2733}
#map{position:absolute;inset:0}
#p{position:absolute;z-index:5;top:10px;left:10px;width:290px;max-width:calc(100% - 20px);max-height:calc(100% - 20px);overflow:auto;background:#fffffff0;border-radius:10px;box-shadow:0 4px 18px #0005;padding:8px 12px}
#p summary{cursor:pointer;font-weight:700;font-size:16px}
#p summary small{font-weight:400;color:#667}
#p .b{margin-top:8px;display:flex;flex-direction:column;gap:8px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#445}
label.c{flex-direction:row;align-items:center;gap:6px;color:#1b2733}
label b{font-size:15px;color:#000}
.r{display:flex;gap:6px}
input,select,button{font:inherit;padding:6px 8px;border:1px solid #b9c2cc;border-radius:6px;background:#fff;min-width:0}
input[type=range]{padding:0;accent-color:#f08a00;width:100%}
input[type=checkbox]{padding:0}
#q{flex:1}
button{cursor:pointer;background:#f08a00;border-color:#f08a00;color:#fff;font-weight:600}
#info{line-height:1.5;background:#f3f6f9;border-radius:6px;padding:6px 8px;font-variant-numeric:tabular-nums}
#st{font-size:11px;color:#556;white-space:pre-wrap}
#co{position:absolute;z-index:4;left:10px;bottom:10px;background:#000a;color:#fff;padding:3px 7px;border-radius:5px;font-size:11px;pointer-events:none}
</style>
</head>
<body>
<div id="map"></div>
<details id="p" open>
<summary>SunCast <small>ombres solaires 3D</small></summary>
<div class="b">
 <div class="r"><input id="q" placeholder="Rechercher un lieu"><button id="go">OK</button><button id="gps">GPS</button></div>
 <label>Date<input type="date" id="date"></label>
 <label>Heure locale <b id="tv"></b><input type="range" id="time" min="0" max="1435" step="5"></label>
 <div class="r"><button id="play" style="flex:1">Lecture</button><button id="now" style="flex:1">Maintenant</button></div>
 <div id="info"></div>
 <label>Fond de carte
  <select id="base"><option value="osm">OpenStreetMap</option><option value="carto">Clair (Carto)</option><option value="sat">Satellite (Esri)</option><option value="topo">Topographique</option></select>
 </label>
 <label class="c"><input type="checkbox" id="cb" checked>Bâtiments 3D</label>
 <label class="c"><input type="checkbox" id="cs" checked>Ombres des bâtiments</label>
 <label class="c"><input type="checkbox" id="cr" checked>Relief 3D et ombrage du relief</label>
 <div id="st">Initialisation...</div>
</div>
</details>
<div id="co"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),R=Math.PI/180,say=t=>$('st').textContent=t;
const pad=n=>String(n).padStart(2,'0'),hh=m=>pad(Math.floor(m/60))+':'+pad(m%60);
if(!window.maplibregl){say('MapLibre ne se charge pas : vérifie la connexion internet.');return;}

let map,ready=false,sun={el:0,az:0},feats=new Map(),fetched=null,reqId=0,tBuild,tShadow,timer=null;

const n0=new Date();
$('date').value=n0.getFullYear()+'-'+pad(n0.getMonth()+1)+'-'+pad(n0.getDate());
$('time').value=Math.min(1435,Math.round((n0.getHours()*60+n0.getMinutes())/5)*5);

function sunPos(date,lat,lng){
 const d=date.getTime()/864e5-10957.5,M=R*(357.5291+.98560028*d),
 L=M+R*(1.9148*Math.sin(M)+.02*Math.sin(2*M)+3e-4*Math.sin(3*M))+R*102.9372+Math.PI,e=R*23.4397,
 dec=Math.asin(Math.sin(e)*Math.sin(L)),ra=Math.atan2(Math.sin(L)*Math.cos(e),Math.cos(L)),
 H=R*(280.16+360.9856235*d)+R*lng-ra,phi=lat*R;
 return{el:Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H))/R,
  az:(Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi))/R+180+360)%360};
}
const ymd=()=>$('date').value.split('-').map(Number);
function when(){const [y,m,d]=ymd(),t=+$('time').value;return new Date(y,m-1,d,Math.floor(t/60),t%60);}
function dayInfo(c){
 const [y,m,d]=ymd();let up=null,dn=null,prev=null;
 for(let i=0;i<=1440;i+=5){
  const e=sunPos(new Date(y,m-1,d,0,i),c.lat,c.lng).el;
  if(prev!==null){if(prev<-.833&&e>=-.833&&up===null)up=i;if(prev>=-.833&&e<-.833)dn=i;}
  prev=e;
 }
 return{up,dn};
}

function hull(p){
 p=p.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(p.length<3)return p;
 const x=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]),lo=[],up=[];
 for(const v of p){while(lo.length>=2&&x(lo[lo.length-2],lo[lo.length-1],v)<=0)lo.pop();lo.push(v);}
 for(let i=p.length-1;i>=0;i--){const v=p[i];while(up.length>=2&&x(up[up.length-2],up[up.length-1],v)<=0)up.pop();up.push(v);}
 lo.pop();up.pop();return lo.concat(up);
}

function shadows(){
 if(!ready)return;
 const out=[];let n=0;
 if(sun.el>1&&$('cs').checked){
  const b=map.getBounds(),pd=.004,w=b.getWest()-pd,e=b.getEast()+pd,s=b.getSouth()-pd,nn=b.getNorth()+pd,az=sun.az*R,polys=[];
  for(const f of feats.values()){
   const q=f.properties;if(q.lng<w||q.lng>e||q.lat<s||q.lat>nn)continue;
   n++;
   const len=Math.min(400,q.h/Math.tan(sun.el*R)),
    dx=-Math.sin(az)*len/(111320*Math.cos(q.lat*R)),dy=-Math.cos(az)*len/111320,pts=[];
   for(const c of f.geometry.coordinates[0])pts.push(c,[c[0]+dx,c[1]+dy]);
   const h=hull(pts);if(h.length>2)polys.push([h.concat([h[0]])]);
  }
  let merged=null;
  if(window.polygonClipping&&polys.length>1&&polys.length<4000){
   try{merged=polygonClipping.union(polys[0],...polys.slice(1));}catch(err){merged=null;}
  }
  if(merged)out.push({type:'Feature',properties:{},geometry:{type:'MultiPolygon',coordinates:merged}});
  else for(const p of polys)out.push({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:p}});
 }
 map.getSource('shd').setData({type:'FeatureCollection',features:out});
 const base=feats.size+' bâtiments en mémoire';
 say(sun.el<=1?'Soleil sous l\'horizon : pas d\'ombre portée. '+base:base+' · '+n+' dans la vue');
}
const later=()=>{clearTimeout(tShadow);tShadow=setTimeout(shadows,80);};

function refresh(){
 if(!ready)return;
 const c=map.getCenter();sun=sunPos(when(),c.lat,c.lng);
 const di=dayInfo(c);
 $('tv').textContent=hh(+$('time').value);
 $('info').innerHTML='Azimut : '+sun.az.toFixed(1)+'° · Hauteur : '+sun.el.toFixed(1)+'°<br>Lever : '+(di.up===null?'--':hh(di.up))+' · Coucher : '+(di.dn===null?'--':hh(di.dn))+(di.up!==null&&di.dn!==null?'<br>Jour : '+Math.floor((di.dn-di.up)/60)+' h '+pad((di.dn-di.up)%60):'');
 try{map.setLight({anchor:'map',position:[1.5,sun.az,Math.max(0,90-sun.el)],intensity:.5,color:'#fff'});}catch(e){}
 map.setPaintProperty('hill','hillshade-illumination-direction',sun.az);
 map.setPaintProperty('hill','hillshade-exaggeration',sun.el>0?Math.min(.9,.25+.9*Math.exp(-sun.el/25)):0);
 later();
}

async function load(){
 if(!ready)return;
 if(map.getZoom()<16){say('Zoome à partir du niveau 16 pour charger les bâtiments.');return;}
 const b=map.getBounds();
 if(fetched&&b.getWest()>=fetched[0]&&b.getSouth()>=fetched[1]&&b.getEast()<=fetched[2]&&b.getNorth()<=fetched[3])return;
 const id=++reqId,px=(b.getEast()-b.getWest())*.1,py=(b.getNorth()-b.getSouth())*.1,
  box=[b.getWest()-px,b.getSouth()-py,b.getEast()+px,b.getNorth()+py];
 say('Chargement des bâtiments OpenStreetMap...');
 const q='[out:json][timeout:25];way["building"]('+box[1]+','+box[0]+','+box[3]+','+box[2]+');out tags geom;';
 const servers=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
 let data=null,last='aucune réponse';
 for(const u of servers){
  try{
   const ac=new AbortController(),t=setTimeout(()=>ac.abort(),25000);
   const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q),signal:ac.signal});
   clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);data=await r.json();break;
  }catch(e){last=u.split('/')[2]+' : '+(e.message||e);}
 }
 if(id!==reqId)return;
 if(!data){say('Échec Overpass ('+last+'). Déplace la carte pour réessayer.');return;}
 if(feats.size>12000)feats.clear();
 for(const w of data.elements){
  if(w.type!=='way'||!w.geometry||w.geometry.length<4||feats.has(w.id))continue;
  const ring=w.geometry.map(p=>[p.lon,p.lat]),a=ring[0],z=ring[ring.length-1];
  if(a[0]!==z[0]||a[1]!==z[1])continue;
  const t=w.tags||{};
  let h=parseFloat(t.height);if(!isFinite(h)){const l=parseFloat(t['building:levels']);h=isFinite(l)?l*3+1:7;}
  h=Math.min(150,Math.max(3,h));
  let base=parseFloat(t.min_height);if(!isFinite(base)){const l=parseFloat(t['building:min_level']);base=isFinite(l)?l*3:0;}
  base=Math.min(base,h-1);
  let lat=0,lng=0;for(const p of ring){lng+=p[0];lat+=p[1];}
  feats.set(w.id,{type:'Feature',id:w.id,properties:{h,base,lat:lat/ring.length,lng:lng/ring.length},geometry:{type:'Polygon',coordinates:[ring]}});
 }
 fetched=box;
 map.getSource('bld').setData({type:'FeatureCollection',features:[...feats.values()]});
 shadows();
}

const B={
 osm:[['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],'© OpenStreetMap',19],
 carto:[['https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'],'© OpenStreetMap © CARTO',20],
 sat:[['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],'Imagery © Esri',19],
 topo:[['https://tile.opentopomap.org/{z}/{x}/{y}.png'],'© OpenTopoMap',17]
};
const style={version:8,sources:{},layers:[]};
for(const k in B){
 style.sources[k]={type:'raster',tiles:B[k][0],tileSize:256,maxzoom:B[k][2],attribution:B[k][1]};
 style.layers.push({id:'b-'+k,type:'raster',source:k,layout:{visibility:k==='osm'?'visible':'none'}});
}

map=new maplibregl.Map({container:'map',style,center:[1.4442,44.447],zoom:17,pitch:60,bearing:-20,maxZoom:19,maxPitch:80,canvasContextAttributes:{antialias:true}});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
map.addControl(new maplibregl.ScaleControl({maxWidth:120,unit:'metric'}),'bottom-right');

map.on('load',()=>{
 map.addSource('dem',{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],encoding:'terrarium',tileSize:256,maxzoom:15,attribution:'Relief : Mapzen / AWS'});
 map.addLayer({id:'hill',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':.4,'hillshade-shadow-color':'#0b1a2e','hillshade-highlight-color':'#ffffff','hillshade-accent-color':'#0b1a2e','hillshade-illumination-anchor':'map','hillshade-illumination-direction':180}});
 map.addSource('shd',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
 map.addLayer({id:'shd',type:'fill',source:'shd',paint:{'fill-color':'#0b1a2e','fill-opacity':.5}});
 map.addSource('bld',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
 map.addLayer({id:'bld3d',type:'fill-extrusion',source:'bld',paint:{'fill-extrusion-color':'#e6dfd2','fill-extrusion-height':['get','h'],'fill-extrusion-base':['get','base'],'fill-extrusion-opacity':.95,'fill-extrusion-vertical-gradient':true}});
 try{map.setTerrain({source:'dem',exaggeration:1});}catch(e){}
 ready=true;refresh();load();
});
map.on('moveend',()=>{
 const c=map.getCenter();$('co').textContent=c.lat.toFixed(5)+', '+c.lng.toFixed(5);
 refresh();clearTimeout(tBuild);tBuild=setTimeout(load,500);
});
map.on('error',e=>{if(e&&e.error&&!/tile|Failed to fetch|NetworkError/i.test(String(e.error.message)))say('Erreur carte : '+e.error.message);});

$('date').addEventListener('input',refresh);
$('time').addEventListener('input',refresh);
$('now').onclick=()=>{
 const n=new Date();
 $('date').value=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());
 $('time').value=Math.min(1435,Math.round((n.getHours()*60+n.getMinutes())/5)*5);refresh();
};
$('play').onclick=()=>{
 if(timer){clearInterval(timer);timer=null;$('play').textContent='Lecture';return;}
 $('play').textContent='Pause';
 timer=setInterval(()=>{$('time').value=(+$('time').value+10)%1440;refresh();},150);
};
$('base').onchange=e=>{for(const k in B)map.setLayoutProperty('b-'+k,'visibility',k===e.target.value?'visible':'none');};
const vis=(id,on)=>map.setLayoutProperty(id,'visibility',on?'visible':'none');
$('cb').onchange=e=>vis('bld3d',e.target.checked);
$('cs').onchange=()=>shadows();
$('cr').onchange=e=>{vis('hill',e.target.checked);try{map.setTerrain(e.target.checked?{source:'dem',exaggeration:1}:null);}catch(x){}};
$('go').onclick=async()=>{
 const q=$('q').value.trim();if(!q)return;
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)),j=await r.json();
  if(!j.length)return say('Lieu introuvable.');
  map.flyTo({center:[+j[0].lon,+j[0].lat],zoom:17});
 }catch(e){say('Recherche impossible : '+(e.message||e));}
};
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
$('gps').onclick=()=>{
 if(!navigator.geolocation)return say('Géolocalisation indisponible.');
 navigator.geolocation.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:17}),e=>say('Position refusée : '+e.message));
};
})();
</script>
</body>
</html>
