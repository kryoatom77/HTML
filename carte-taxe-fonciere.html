<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimation taxe Foncière</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE8D8; --paper-dark:#E2D8BE; --ink:#24291F;
    --line:#B8AD8F; --accent:#8B3A2B; --navy:#2F4858;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    background-image:linear-gradient(var(--paper-dark) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-dark) 1px, transparent 1px);
    background-size:28px 28px;
  }
  header{ padding:16px 24px 8px; border-bottom:2px solid var(--ink); }
  header h1{ font-family:'Fraunces',serif; font-weight:700; font-size:1.5rem; margin:0 0 2px; }
  header .sub{ font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--navy); text-transform:uppercase; letter-spacing:1px; }
  main{ display:grid; grid-template-columns:360px 1fr; min-height:calc(100vh - 70px); }
  @media (max-width:820px){ main{grid-template-columns:1fr;} }
  .fiche{ border-right:2px solid var(--ink); padding:18px; background:rgba(239,232,216,.6); overflow-y:auto; max-height:calc(100vh - 70px); }
  .fiche h2{ font-family:'Fraunces',serif; font-size:.95rem; margin:0 0 10px; border-bottom:1px dashed var(--line); padding-bottom:6px; }
  .fiche h2.step{ margin-top:18px; }
  label{ display:block; font-size:.74rem; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.4px; color:var(--navy); margin-bottom:4px; }
  .field{ margin-bottom:12px; }
  .field .help{ font-size:.72rem; color:#555; margin-top:4px; line-height:1.3; }
  input[type=number], input[type=text], select{
    width:100%; padding:7px 9px; border:1px solid var(--ink);
    background:#fdfbf5; font-family:'IBM Plex Mono',monospace; font-size:.9rem; color:var(--ink);
  }
  input:focus, select:focus{ outline:2px solid var(--accent); }
  #suggestions{ border:1px solid var(--line); background:#fdfbf5; max-height:150px; overflow-y:auto; display:none; }
  #suggestions div{ padding:6px 10px; font-size:.82rem; cursor:pointer; border-bottom:1px solid var(--paper-dark); }
  #suggestions div:hover{ background:var(--paper-dark); }
  .btn{
    display:inline-block; width:100%; padding:9px 10px; margin-top:4px;
    background:var(--navy); color:#fdfbf5; border:1px solid var(--ink);
    font-family:'IBM Plex Mono',monospace; font-size:.78rem; text-transform:uppercase;
    letter-spacing:.5px; cursor:pointer; text-align:center;
  }
  .btn:hover{ background:#243944; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .est-box{
    margin-top:10px; padding:10px; border:1px dashed var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:.78rem; line-height:1.6; display:none;
  }
  .est-box.show{ display:block; }
  .est-box .warn{ color:var(--accent); }
  .stamp-zone{ margin-top:18px; min-height:150px; border:1px dashed var(--line); padding:14px; position:relative; }
  .stamp{ display:none; text-align:center; }
  .stamp.show{ display:block; }
  .stamp .ring{
    display:inline-block; border:3px solid var(--accent); border-radius:50%; color:var(--accent);
    padding:12px 8px; transform:rotate(-6deg); font-family:'Fraunces',serif; font-weight:700; line-height:1.1;
  }
  .stamp .ring .amount{ font-size:1.4rem; display:block; }
  .stamp .ring .label{ font-size:.58rem; text-transform:uppercase; letter-spacing:1.5px; }
  .stamp .detail{ margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:.76rem; text-align:left; line-height:1.6; }
  .stamp .detail b{ color:var(--ink); }
  .placeholder-text{ font-size:.78rem; color:#777; font-style:italic; }
  .note{ margin-top:14px; font-size:.7rem; color:#666; line-height:1.4; border-top:1px dashed var(--line); padding-top:8px; }
  #map{ height:calc(100vh - 70px); min-height:420px; filter:sepia(6%) saturate(90%); }
  .leaflet-tooltip.dept-label{ font-family:'IBM Plex Mono',monospace; font-size:.7rem; background:rgba(253,251,245,.9); border:1px solid var(--ink); border-radius:0; }
  .status{
    position:absolute; z-index:1000; top:12px; left:12px; background:rgba(253,251,245,.92);
    border:1px solid var(--ink); padding:6px 10px; font-family:'IBM Plex Mono',monospace; font-size:.72rem; max-width:320px;
  }
</style>
</head>
<body>

<header>
  <h1>Estimation taxe Foncière</h1>
</header>

<main>
  <div class="fiche">
    <div class="field">
      <label for="communeSearch">Commune</label>
      <input type="text" id="communeSearch" placeholder="Tapez un nom de commune…" autocomplete="off">
      <div id="suggestions"></div>
    </div>

    <div class="field">
      <label for="typeLocal">Type de bien</label>
      <select id="typeLocal">
        <option value="Maison">Maison</option>
        <option value="Appartement">Appartement</option>
      </select>
    </div>
    <div class="field">
      <label for="surface">Surface habitable (m²)</label>
      <input type="number" id="surface" placeholder="ex. 90" min="1" step="1">
    </div>
    <div class="field">
      <label for="rendement">Taux de rendement locatif retenu (%)</label>
      <input type="number" id="rendement" value="4.5" min="1" max="12" step="0.1">
    </div>
    <button class="btn" id="estimateBtn">Estimer la valeur locative (DVF)</button>
    <div class="est-box" id="estBox"></div>

    <div class="field" style="margin-top:12px;">
      <label for="valeurLocative">Valeur locative brute mensuelle (€) — modifiable</label>
      <input type="number" id="valeurLocative" placeholder="rempli après estimation, ou saisie libre" min="0" step="5">
      <button class="btn" id="validateBtn">Recalculer l'estimation</button>
    </div>

    <div class="stamp-zone">
      <div id="placeholder" class="placeholder-text">Renseignez commune + bien, estimez la valeur locative, puis cliquez n'importe où sur la carte (ou cherchez une commune) pour le taux exact.</div>
      <div class="stamp" id="stamp">
        <div class="ring"><span class="amount" id="amountText">— €</span><span class="label">estimation / an</span></div>
        <div class="detail" id="detailText"></div>
      </div>
    </div>
  </div>

  <div style="position:relative;">
    <div class="status" id="status">Cliquez un point sur la carte pour le taux de la commune exacte.</div>
    <div id="map"></div>
  </div>
</main>

<script>
const ODS_BASE = "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/fiscalite-locale-des-particuliers/records";
const GEOJSON_URL = "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson";
const GEO_API = "https://geo.api.gouv.fr/communes";
const DVF_ODS_BASE = "https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/buildingref-france-demande-de-valeurs-foncieres-geolocalisee-millesime/records";

let fieldMap = null;
let dvfFieldMap = null;
let selectedCommune = null;
const statusEl = document.getElementById('status');
const valeurLocativeInput = document.getElementById('valeurLocative');

function setStatus(msg){ statusEl.textContent = msg; }

async function detectFields(){
  try{
    const res = await fetch(`${ODS_BASE}?limit=1`);
    const data = await res.json();
    const rec = data.results && data.results[0];
    if(!rec) throw new Error("dataset vide");
    const keys = Object.keys(rec);
    const find = (re) => keys.find(k => re.test(k));
    fieldMap = {
      communeCode: find(/^(codgeo|com_code|code_com|insee|code_insee)/i) || find(/commune.*code|code.*commune/i),
      deptCode: find(/^(dep_code|code_dep|codedep|dep)/i),
      tfb: find(/tfb/i) || find(/foncier.*bati/i) || find(/fonci.*b[aâ]ti/i),
    };
    console.log("Champs ODS détectés :", fieldMap);
    if(!fieldMap.tfb) setStatus("Taux TFB introuvable dans le schéma — voir console.");
  }catch(e){
    console.error(e);
    setStatus("Impossible d'interroger data.economie.gouv.fr.");
  }
}

async function queryByField(field, value, limit){
  const attempts = [`${field}="${value}"`, `${field}=${value}`];
  for(const clause of attempts){
    try{
      const url = `${ODS_BASE}?where=${encodeURIComponent(clause)}&limit=${limit}`;
      const res = await fetch(url);
      if(!res.ok) continue;
      const data = await res.json();
      if(data.results && data.results.length) return data.results;
    }catch(e){}
  }
  return [];
}

async function detectDvfFields(){
  if(dvfFieldMap) return dvfFieldMap;
  const res = await fetch(`${DVF_ODS_BASE}?limit=1`);
  const data = await res.json();
  const rec = data.results && data.results[0];
  if(!rec) throw new Error("dataset DVF vide");
  const keys = Object.keys(rec);
  const find = (re) => keys.find(k => re.test(k));
  dvfFieldMap = {
    communeCode: find(/^(codgeo|code_commune|com_code|insee|code_insee)/i) || find(/commune.*code|code.*commune/i),
    typeLocal: find(/type_?local/i) || find(/type.*bien/i),
    valeurFonciere: find(/valeur_?fonciere/i) || find(/^prix/i),
    surface: find(/surface_?reelle_?bati/i) || find(/surface.*bati/i) || find(/^surface/i),
  };
  console.log("Champs DVF (Opendatasoft) détectés :", dvfFieldMap);
  return dvfFieldMap;
}

async function queryDvfByCommune(field, value, limit){
  const attempts = [`${field}="${value}"`, `${field}=${value}`];
  for(const clause of attempts){
    try{
      const url = `${DVF_ODS_BASE}?where=${encodeURIComponent(clause)}&limit=${limit}`;
      const res = await fetch(url);
      if(!res.ok) continue;
      const data = await res.json();
      if(data.results && data.results.length) return data.results;
    }catch(e){}
  }
  return [];
}

function baseImposition(){
  const vlMensuelle = parseFloat(valeurLocativeInput.value);
  if(isNaN(vlMensuelle) || vlMensuelle <= 0) return null;
  return vlMensuelle * 12 * 0.5; // valeur locative annuelle × abattement forfaitaire légal de 50%
}

let lastTaux = null;
let lastLabel = null;

function showResult(taux, label){
  lastTaux = taux;
  lastLabel = label;
  const base = baseImposition();
  document.getElementById('placeholder').style.display = 'none';
  const stamp = document.getElementById('stamp');
  stamp.classList.add('show');
  if(base === null){
    document.getElementById('amountText').textContent = "?";
    document.getElementById('detailText').innerHTML =
      `<b>Valeur locative manquante.</b> Estimez-la ou saisissez-la ci-dessus.<br>Taux global TFB — ${label} : <b>${taux.toFixed(2)} %</b>`;
    return;
  }
  const impot = base * taux / 100;
  document.getElementById('amountText').textContent = impot.toLocaleString('fr-FR', {maximumFractionDigits:0}) + " €";
  document.getElementById('detailText').innerHTML =
    `<b>Commune :</b> ${label}<br><b>Taux global TFB :</b> ${taux.toFixed(2)} %<br><b>Base d'imposition (loyer mensuel × 12 × 50%) :</b> ${base.toLocaleString('fr-FR')} €<br><b>Calcul :</b> ${base.toLocaleString('fr-FR')} × ${taux.toFixed(2)} %`;
}

document.getElementById('validateBtn').addEventListener('click', () => {
  if(lastTaux == null){
    setStatus("Choisissez d'abord une commune (recherche ou clic sur la carte).");
    return;
  }
  showResult(lastTaux, lastLabel);
});

// --- Carte ---
const map = L.map('map',{center:[46.6,2.4],zoom:6,zoomControl:true});
L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap France', maxZoom:20, subdomains:'abc'
}).addTo(map);

function rgbLerp(c1, c2, f){
  return c1.map((v,i) => Math.round(v + (c2[i]-v)*f));
}
// Vert franc -> jaune -> rouge franc, forte saturation pour un contraste net
function colorForTauxRelative(taux, min, max){
  const span = (max - min) || 1;
  const t = Math.max(0, Math.min(1, (taux - min) / span));
  const green = [16, 141, 63], yellow = [255, 214, 0], red = [200, 30, 30];
  const rgb = t < 0.5 ? rgbLerp(green, yellow, t*2) : rgbLerp(yellow, red, (t-0.5)*2);
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

const MIN_ZOOM_COMMUNES = 10;
const MAX_COMMUNES_DISPLAY = 90;
const communeLayer = L.geoJSON(null, {
  style: f => ({ color:'#fdfbf5', weight:1, fillColor:f.properties._color, fillOpacity:.75 }),
  onEachFeature: (f, layer) => {
    layer.bindTooltip(`${f.properties.nom} — ${f.properties._taux.toFixed(2)} %`, {className:'dept-label', sticky:true});
    layer.on('click', () => selectCommuneFromZone(f.properties));
  }
}).addTo(map);
const deptGeoCache = {}; // code département -> FeatureCollection (contours)
let viewportTimer = null;
let currentDepCode = null;

async function fetchDeptCommunesGeo(depCode){
  if(deptGeoCache[depCode]) return deptGeoCache[depCode];
  const res = await fetch(`https://geo.api.gouv.fr/departements/${depCode}/communes?geometry=contour&format=geojson&fields=nom,code`);
  const geo = await res.json();
  deptGeoCache[depCode] = geo;
  return geo;
}

function geometryBBox(geom){
  let minLon=Infinity, minLat=Infinity, maxLon=-Infinity, maxLat=-Infinity;
  (function walk(c){
    if(typeof c[0] === 'number'){
      if(c[0]<minLon) minLon=c[0]; if(c[0]>maxLon) maxLon=c[0];
      if(c[1]<minLat) minLat=c[1]; if(c[1]>maxLat) maxLat=c[1];
    } else { c.forEach(walk); }
  })(geom.coordinates);
  return [minLon, minLat, maxLon, maxLat];
}

function bboxIntersects(bbox, bounds){
  return !(bbox[2] < bounds.getWest() || bbox[0] > bounds.getEast() || bbox[3] < bounds.getSouth() || bbox[1] > bounds.getNorth());
}

function selectCommuneFromZone(props){
  selectedCommune = { nom:props.nom, code:props.code, codeDepartement:currentDepCode, centre:null };
  searchInput.value = `${props.nom} (${currentDepCode})`;
  setStatus(`${props.nom} (${props.code}) — taux TFB : ${props._taux.toFixed(2)} %`);
  showResult(props._taux, props.nom);
}

async function refreshViewportCommunes(){
  communeLayer.clearLayers();
  if(map.getZoom() < MIN_ZOOM_COMMUNES){
    setStatus("Zoomez (niveau ville/village) pour afficher le zonage commune par commune.");
    return;
  }
  if(!fieldMap || !fieldMap.communeCode || !fieldMap.tfb){ setStatus("Schéma de données non résolu."); return; }
  setStatus("Chargement du zonage de la zone visible…");
  try{
    const center = map.getCenter();
    const bounds = map.getBounds();
    const resDep = await fetch(`${GEO_API}?lat=${center.lat}&lon=${center.lng}&fields=codeDepartement&format=json`);
    const listDep = await resDep.json();
    const cInfo = Array.isArray(listDep) ? listDep[0] : listDep;
    if(!cInfo || !cInfo.codeDepartement){ setStatus("Zone hors France."); return; }
    const depCode = cInfo.codeDepartement;
    currentDepCode = depCode;

    const geo = await fetchDeptCommunesGeo(depCode);
    const visibleFeatures = geo.features.filter(f => bboxIntersects(geometryBBox(f.geometry), bounds)).slice(0, MAX_COMMUNES_DISPLAY);

    if(!visibleFeatures.length){ setStatus("Aucune commune identifiée dans la zone visible."); return; }

    const codes = visibleFeatures.map(f => `"${f.properties.code}"`).join(',');
    const clause = `${fieldMap.communeCode} in (${codes})`;
    const res = await fetch(`${ODS_BASE}?where=${encodeURIComponent(clause)}&limit=${visibleFeatures.length}`);
    const data = await res.json();
    const tauxByCode = {};
    (data.results || []).forEach(r => { tauxByCode[r[fieldMap.communeCode]] = parseFloat(r[fieldMap.tfb]); });

    const withTaux = visibleFeatures.filter(f => {
      const t = tauxByCode[f.properties.code];
      return t != null && !isNaN(t);
    });
    if(!withTaux.length){ setStatus("Aucun taux disponible pour la zone visible."); return; }

    const tauxValues = withTaux.map(f => tauxByCode[f.properties.code]);
    const min = Math.min(...tauxValues), max = Math.max(...tauxValues);

    withTaux.forEach(f => {
      const taux = tauxByCode[f.properties.code];
      f.properties._taux = taux;
      f.properties._color = colorForTauxRelative(taux, min, max);
    });
    communeLayer.addData({ type:'FeatureCollection', features: withTaux });
    updateLegend(min, max);
    setStatus(`${withTaux.length} commune(s) — taux de ${min.toFixed(2)}% (vert) à ${max.toFixed(2)}% (rouge) sur cette zone.`);
  }catch(e){
    console.error(e);
    setStatus("Échec du chargement du zonage (voir console).");
  }
}

map.on('moveend zoomend', () => {
  clearTimeout(viewportTimer);
  viewportTimer = setTimeout(refreshViewportCommunes, 350);
});

async function onMapClick(latlng){
  setStatus(`Recherche de la commune…`);
  try{
    const url = `${GEO_API}?lat=${latlng.lat}&lon=${latlng.lng}&fields=nom,code,codeDepartement,centre&format=json`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const list = await res.json();
    const c = Array.isArray(list) ? list[0] : list;
    if(!c || !c.code){ setStatus("Aucune commune trouvée à cet endroit (hors France ?)."); return; }
    if(marker) map.removeLayer(marker);
    marker = L.marker([latlng.lat, latlng.lng]).addTo(map);
    await selectCommune(c, false);
  }catch(e){
    console.error("Échec géolocalisation inverse :", e);
    setStatus("Échec de la géolocalisation inverse (voir console) — utilisez la recherche par nom.");
  }
}

let marker = null;
map.on('click', (e) => onMapClick(e.latlng));

fetch(GEOJSON_URL).then(r=>r.json()).then(geo=>{
  L.geoJSON(geo, {
    style: { color:'#24291F', weight:1, fillColor:'transparent', fillOpacity:0, interactive:false },
    onEachFeature: (feature, layer) => {
      layer.bindTooltip(feature.properties.nom, {className:'dept-label', sticky:true});
    }
  }).addTo(map);
}).catch(()=> setStatus("Impossible de charger les contours des départements."));

// Légende du calque
const legendEl = L.control({position:'bottomleft'});
legendEl.onAdd = function(){
  const div = L.DomUtil.create('div', 'status');
  div.style.top = 'auto'; div.style.left = 'auto';
  div.id = 'legendBox';
  div.innerHTML = `<div style="font-family:'IBM Plex Mono',monospace;font-size:.68rem;">
    <div id="legendTitle" style="margin-bottom:4px;">Zoomez pour afficher le zonage</div>
    <div style="width:160px;height:8px;background:linear-gradient(90deg, rgb(16,141,63), rgb(255,214,0), rgb(200,30,30));"></div>
    <div id="legendMinMax" style="display:flex;justify-content:space-between;"><span>—</span><span>—</span></div>
  </div>`;
  return div;
};
legendEl.addTo(map);

function updateLegend(min, max){
  const title = document.getElementById('legendTitle');
  const minmax = document.getElementById('legendMinMax');
  if(title) title.textContent = 'Taux TFB — zone visible';
  if(minmax) minmax.innerHTML = `<span>${min.toFixed(2)}%</span><span>${max.toFixed(2)}%</span>`;
}

// --- Recherche commune ---
const searchInput = document.getElementById('communeSearch');
const suggestBox = document.getElementById('suggestions');
let searchTimer = null;
let searchAbort = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  if(searchAbort) searchAbort.abort();
  const q = searchInput.value.trim();
  if(q.length < 2){ suggestBox.style.display='none'; return; }
  searchTimer = setTimeout(async () => {
    searchAbort = new AbortController();
    try{
      const res = await fetch(`${GEO_API}?nom=${encodeURIComponent(q)}&fields=nom,code,codeDepartement,centre&boost=population&limit=8`, {signal: searchAbort.signal});
      const list = await res.json();
      suggestBox.innerHTML = '';
      if(!list.length){ suggestBox.style.display='none'; return; }
      list.forEach(c => {
        const div = document.createElement('div');
        div.textContent = `${c.nom} (${c.codeDepartement})`;
        div.onclick = () => selectCommune(c);
        suggestBox.appendChild(div);
      });
      suggestBox.style.display = 'block';
    }catch(e){ if(e.name !== 'AbortError') console.error(e); }
  }, 300);
});

async function selectCommune(c, recenter=true){
  selectedCommune = c;
  searchInput.value = `${c.nom} (${c.codeDepartement})`;
  suggestBox.style.display = 'none';
  if(recenter && c.centre && c.centre.coordinates){ map.setView([c.centre.coordinates[1], c.centre.coordinates[0]], 13); }
  setStatus(`Recherche du taux pour ${c.nom}…`);
  if(!fieldMap || !fieldMap.communeCode || !fieldMap.tfb){ setStatus("Schéma de données non résolu."); return; }
  const records = await queryByField(fieldMap.communeCode, c.code, 1);
  if(!records.length){ setStatus(`Aucune donnée de taux pour ${c.nom} (${c.code}).`); return; }
  const taux = parseFloat(records[0][fieldMap.tfb]);
  if(isNaN(taux)){ setStatus(`Taux illisible pour ${c.nom}.`); return; }
  setStatus(`${c.nom} (${c.code}) — taux TFB : ${taux.toFixed(2)} %`);
  showResult(taux, c.nom);
  clearTimeout(viewportTimer);
  viewportTimer = setTimeout(refreshViewportCommunes, 400);
}

document.addEventListener('click', (e) => {
  if(!suggestBox.contains(e.target) && e.target !== searchInput) suggestBox.style.display='none';
});

// --- Estimation valeur locative via DVF (Opendatasoft, CORS OK) ---
document.getElementById('estimateBtn').addEventListener('click', async () => {
  const box = document.getElementById('estBox');
  box.classList.add('show');
  if(!selectedCommune){
    box.innerHTML = `<span class="warn">Choisissez d'abord une commune ci-dessus.</span>`;
    return;
  }
  const surface = parseFloat(document.getElementById('surface').value);
  if(isNaN(surface) || surface <= 0){
    box.innerHTML = `<span class="warn">Renseignez la surface habitable.</span>`;
    return;
  }
  const type = document.getElementById('typeLocal').value;
  const rendement = parseFloat(document.getElementById('rendement').value) || 4.5;
  box.innerHTML = `Interrogation des transactions DVF pour ${selectedCommune.nom}…`;
  try{
    const dfm = await detectDvfFields();
    if(!dfm.communeCode || !dfm.valeurFonciere || !dfm.surface){
      box.innerHTML = `<span class="warn">Schéma DVF non résolu (voir console). Saisissez la valeur locative manuellement.</span>`;
      return;
    }
    const records = await queryDvfByCommune(dfm.communeCode, selectedCommune.code, 100);
    if(!records.length){
      box.innerHTML = `<span class="warn">Aucune transaction trouvée pour ${selectedCommune.nom} (${selectedCommune.code}). Saisissez la valeur locative manuellement.</span>`;
      return;
    }
    const filtered = dfm.typeLocal
      ? records.filter(r => (r[dfm.typeLocal] || '').toString().toLowerCase().includes(type.toLowerCase()))
      : records;
    const pool = filtered.length ? filtered : records; // repli si le type n'est pas filtrable
    const prices = pool
      .map(r => parseFloat(r[dfm.valeurFonciere]) / parseFloat(r[dfm.surface]))
      .filter(v => !isNaN(v) && v > 200 && v < 15000);
    if(!prices.length){
      box.innerHTML = `<span class="warn">Transactions trouvées mais prix/m² inexploitables pour « ${type} » à ${selectedCommune.nom}. Saisissez la valeur locative manuellement.</span>`;
      return;
    }
    prices.sort((a,b)=>a-b);
    const median = prices[Math.floor(prices.length/2)];
    const valeurVenale = median * surface;
    const valeurLocativeAnnuelle = valeurVenale * rendement / 100;
    const valeurLocativeMensuelle = valeurLocativeAnnuelle / 12;
    valeurLocativeInput.value = Math.round(valeurLocativeMensuelle);
    box.innerHTML =
      `Source : DVF+ Cerema/DGFiP (public.opendatasoft.com)<br>` +
      `Prix médian observé : <b>${Math.round(median).toLocaleString('fr-FR')} €/m²</b> (${prices.length} transactions${filtered.length ? ` « ${type} »` : ' — type non filtrable, échantillon toutes catégories'})<br>` +
      `Valeur vénale estimée : <b>${Math.round(valeurVenale).toLocaleString('fr-FR')} €</b><br>` +
      `Valeur locative brute (rendement ${rendement}%) : <b>${Math.round(valeurLocativeMensuelle).toLocaleString('fr-FR')} €/mois</b>`;
    if(lastTaux != null) showResult(lastTaux, lastLabel);
  }catch(e){
    console.error(e);
    box.innerHTML = `<span class="warn">Échec de la requête DVF (voir console). Saisissez la valeur locative manuellement.</span>`;
  }
});

detectFields();
</script>
