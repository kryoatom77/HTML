body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;height:100vh;display:flex;overflow:hidden}

// Interpolation linéaire RGB entre étapes
function lerp(a,b,t){return Math.round(a+(b-a)*t)}
function lerpColor(c1,c2,t){
  return `rgb(${lerp(c1[0],c2[0],t)},${lerp(c1[1],c2[1],t)},${lerp(c1[2],c2[2],t)})`;
}
// Palette 5 étapes : vert → jaune-vert → jaune → orange → rouge
const PAL5=[
  [39,174,96],   // vert
  [142,199,64],  // vert-jaune
  [241,196,15],  // jaune
  [230,126,34],  // orange
  [192,57,43]    // rouge
];
// val entre 0 et 1 → couleur interpolée sur 5 étapes
function palGVR(t){
  t=Math.max(0,Math.min(1,t));
  const seg=t*(PAL5.length-1);
  const i=Math.floor(seg);
  const f=seg-i;
  if(i>=PAL5.length-1) return `rgb(${PAL5[PAL5.length-1].join(',')})`;
  return lerpColor(PAL5[i],PAL5[i+1],f);
}
// Inverse : vert = bien, rouge = mauvais (chômage, crimes, etc.)
// Normal : vert = mauvais, rouge = bien (revenu, ensoleillement)

// ════════════════════════════════════════
// CACHE GeoJSON
// ════════════════════════════════════════
const CACHE={};
async function fetchGJ(url){
  if(CACHE[url]) return CACHE[url];
  const r=await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status} : ${url}`);
  CACHE[url]=await r.json();
  return CACHE[url];
}

// URL GeoJSON communes simplifiées (~1 MB, résolution cantonale)
const URL_COM='https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/communes-version-simplifiee.geojson';
const URL_DEP='https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson';

// ════════════════════════════════════════
// CHOROPLÈTHE DÉPARTEMENT avec palette GVR
// ════════════════════════════════════════
// inverse=true → vert=bas, rouge=haut (sécheresse, crimes…)
// inverse=false → vert=haut, rouge=bas (revenu, soleil…)
async function choroDep(key,min,max,inverse,labelFn,legendSteps){
  const data=await fetchGJ(URL_DEP);
  return L.geoJSON(data,{
    style:f=>{
      const code=f.properties.code;
      const val=DATA[key][code];
      if(val===undefined) return{fillColor:'#444',color:'#222',weight:.5,fillOpacity:.6};
      const t=(val-min)/(max-min);
      const tc=inverse?t:1-t;
      return{fillColor:palGVR(tc),color:'#111',weight:.4,fillOpacity:.72};
    },
    onEachFeature:(f,l)=>{
      const code=f.properties.code;
      const nom=f.properties.nom||code;
      const val=DATA[key][code];
      l.bindPopup(`<b>${nom}</b><br>${labelFn(val)}`);
    }
  });
}

function mkLeg(min,max,unit,inverse){
  const steps=5;
  return Array.from({length:steps},(_,i)=>{
    const t=i/(steps-1);
    const tc=inverse?t:1-t;
    const val=Math.round(min+(max-min)*t);
    return{color:palGVR(tc),label:`${val} ${unit}`};
  });
}

// ════════════════════════════════════════
// GESTION DES CALQUES
// ════════════════════════════════════════
const active={},loaded={};

async function toggle(def,row){
  const id=def.id;
  if(active[id]){
    map.removeLayer(active[id]);
    delete active[id];
    row.classList.remove('on');
    upCount();upLeg();return;
  }
  row.classList.add('loading');
  document.getElementById('st').textContent='Chargement…';
  try{
    let layer=loaded[id];
    if(!layer){layer=await def.load();loaded[id]=layer;}
    layer.addTo(map);
    active[id]=layer;
    row.classList.remove('loading');
    row.classList.add('on');
    document.getElementById('st').textContent='Prêt';
  }catch(e){
    console.error(id,e);
    row.classList.remove('loading');
    row.classList.add('err');
    row.querySelector('.ls').textContent='⚠ '+e.message.slice(0,50);
    document.getElementById('st').textContent='Erreur calque';
  }
  upCount();upLeg();
}

function upCount(){document.getElementById('ac').textContent=Object.keys(active).length;}
function upLeg(){
  const leg=document.getElementById('leg');
  const last=DEFS.filter(d=>active[d.id]&&d.legend&&d.legend.length).pop();
  if(!last){leg.style.display='none';return;}
  document.getElementById('lt').textContent=last.name;
  document.getElementById('lb').innerHTML=last.legend.map(i=>
    `<div class="li2"><div class="lc2" style="background:${i.color}"></div>${i.label}</div>`
  ).join('');
  leg.style.display='block';
}

// ════════════════════════════════════════
// PANNEAU
// ════════════════════════════════════════
const panel=document.getElementById('lc');
let curGroup='';
DEFS.forEach(def=>{
  if(def.group!==curGroup){
    const g=document.createElement('div');
    g.className='gl';g.textContent=def.group;
    panel.appendChild(g);curGroup=def.group;
  }
  const row=document.createElement('div');
  row.className='lr';row.dataset.id=def.id;
  row.innerHTML=`<div class="tog"></div><div class="dot" style="background:${def.color}"></div><div class="li"><div class="ln">${def.name}</div><div class="ls">${def.src}</div></div><div class="spin"></div>`;
  row.addEventListener('click',()=>toggle(def,row));
  panel.appendChild(row);
});

// Calques par défaut
['deps','villes'].forEach(id=>{
  const def=DEFS.find(d=>d.id===id);
  const row=panel.querySelector(`[data-id="${id}"]`);
  if(def&&row) toggle(def,row);
});
